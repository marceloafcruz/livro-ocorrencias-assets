<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sentinela Log MVP</title>
  <meta name="description" content="MVP funcional do Livro de Ocorrências Digital">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="loginView" class="login-shell">
    <section class="login-card">
      <div class="brand-row">
        <div class="brand-mark">SL</div>
        <div>
          <h1>Sentinela Log</h1>
          <p>Livro de Ocorrências Digital</p>
        </div>
      </div>

      <form id="loginForm" class="form-grid">
        <label>
          E-mail
          <input id="email" type="email" autocomplete="username" value="admin@sentinela.local" required>
        </label>
        <label>
          Senha
          <input id="password" type="password" autocomplete="current-password" value="123456" required>
        </label>
        <button type="submit">Entrar</button>
      </form>

      <div class="test-users">
        <strong>Usuários de teste</strong>
        <button data-login="admin@sentinela.local">Admin</button>
        <button data-login="gestor@sentinela.local">Gestor</button>
        <button data-login="seguranca@sentinela.local">Segurança</button>
      </div>
      <p id="loginError" class="error-text"></p>
    </section>
  </div>

  <div id="appView" class="app-shell hidden">
    <aside class="sidebar">
      <div class="brand-row compact">
        <div class="brand-mark">SL</div>
        <div>
          <strong>Sentinela Log</strong>
          <span id="userRole"></span>
        </div>
      </div>
      <nav>
        <button class="nav-btn active" data-screen="dashboard">Dashboard</button>
        <button class="nav-btn" data-screen="newOccurrence">Nova ocorrência</button>
        <button class="nav-btn" data-screen="occurrences">Ocorrências</button>
        <button class="nav-btn" data-screen="users">Usuários</button>
      </nav>
      <button id="logoutBtn" class="logout">Sair</button>
    </aside>

    <main class="content">
      <header class="topbar">
        <div>
          <h2 id="screenTitle">Dashboard</h2>
          <p id="unitLabel">Unidade: Portaria Principal</p>
        </div>
        <button id="panicBtn" class="panic-btn">Pânico</button>
      </header>

      <section id="dashboard" class="screen">
        <div class="metrics">
          <article>
            <span>Total</span>
            <strong id="totalCount">0</strong>
          </article>
          <article>
            <span>Críticas</span>
            <strong id="criticalCount">0</strong>
          </article>
          <article>
            <span>Abertas</span>
            <strong id="openCount">0</strong>
          </article>
          <article>
            <span>Offline/local</span>
            <strong id="localCount">0</strong>
          </article>
        </div>

        <div class="panel">
          <div class="panel-head">
            <h3>Últimas ocorrências</h3>
            <button class="secondary" data-screen-jump="newOccurrence">Registrar</button>
          </div>
          <div id="latestList" class="list"></div>
        </div>
      </section>

      <section id="newOccurrence" class="screen hidden">
        <form id="occurrenceForm" class="panel form-grid">
          <div class="grid-2">
            <label>
              Tipo
              <select id="occType" required>
                <option value="Invasão">Invasão</option>
                <option value="Princípio de incêndio">Princípio de incêndio</option>
                <option value="Visitante irregular">Visitante irregular</option>
                <option value="Dano patrimonial">Dano patrimonial</option>
                <option value="Falha técnica">Falha técnica</option>
                <option value="Ocorrência geral">Ocorrência geral</option>
              </select>
            </label>
            <label>
              Prioridade
              <select id="priority" required>
                <option value="critica">Crítica</option>
                <option value="alta">Alta</option>
                <option value="media">Média</option>
                <option value="baixa">Baixa</option>
              </select>
            </label>
          </div>

          <label>
            Descrição
            <textarea id="description" rows="5" placeholder="Descreva o que aconteceu..." required></textarea>
          </label>

          <div class="grid-2">
            <label>
              Local
              <input id="place" value="Portaria Principal" required>
            </label>
            <label>
              Status
              <select id="status">
                <option value="aberta">Aberta</option>
                <option value="em_atendimento">Em atendimento</option>
                <option value="encerrada">Encerrada</option>
              </select>
            </label>
          </div>

          <div class="actions">
            <button type="button" id="geoBtn" class="secondary">Capturar GPS</button>
            <span id="geoStatus" class="muted">GPS não capturado</span>
          </div>

          <button type="submit">Salvar ocorrência</button>
        </form>
      </section>

      <section id="occurrences" class="screen hidden">
        <div class="panel">
          <div class="panel-head">
            <h3>Ocorrências registradas</h3>
            <button id="exportBtn" class="secondary">Exportar JSON</button>
          </div>
          <div id="occurrenceList" class="list"></div>
        </div>
      </section>

      <section id="users" class="screen hidden">
        <div class="panel">
          <h3>Usuários do MVP</h3>
          <div id="usersList" class="list"></div>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
